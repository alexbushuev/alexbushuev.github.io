<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17161c">
<title>Газ и цепь 3D</title>
<style>
html,body{margin:0;height:100%;background:#17161c;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f3eedf;font:600 16px/1.3 system-ui,-apple-system,sans-serif;background:#17161c;text-align:center;padding:0 24px}
#load b{font:italic 900 44px/1 system-ui,-apple-system,sans-serif;color:#ffc81f;letter-spacing:-.01em}
#bar{width:min(320px,70vw);height:10px;background:#2c2b33}
#bar i{display:block;height:100%;width:0;background:#ffc81f}
#turn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#17161c;color:#ffc81f;font:italic 900 32px/1.1 system-ui,-apple-system,sans-serif;text-align:center;padding:24px;z-index:9}
@media (orientation:portrait) and (max-width:900px){#turn{display:flex}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas">Нужен браузер с WebGL 2.</canvas>
<div id="load"><b>ГАЗ И ЦЕПЬ</b><div id="bar"><i id="fill"></i></div><div id="msg">Заводим…</div></div>
<div id="turn">Поверни телефон боком</div>
<script>
/* wasm and pck are stored gzipped on the server, so a phone downloads a quarter of the size with no server settings */
const BUILD = "__BUILD__";
(function () {
  const real = window.fetch.bind(window);
  window.fetch = async (url, opts) => {
    const u = String(url);
    const m = u.match(/^(.*\.(?:wasm|pck))(?:\?.*)?$/);
    if (!m) return real(url, opts);
    if (typeof DecompressionStream === 'undefined') throw new Error('old browser');
    const r = await real(m[1] + '.gz?v=' + BUILD, opts);
    if (!r.ok) return r;
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip')), {
      status: 200, headers: { 'Content-Type': u.includes('.wasm') ? 'application/wasm' : 'application/octet-stream' } });
  };
})();
</script>
<script>
/* Sounds that loop. Godot's web playback restarts a looping sound by hand at the end of every pass, which clicks;
   a short engine loop clicked over a hundred times a second. The browser's own loop has no seam and does not care about the frame rate. */
window.gazLoops = (function () {
  let ac = null;
  const voices = {};
  const open = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; };
  const wake = () => { open(); if (ac.state !== 'running') ac.resume().catch(() => {}); };
  ['touchend', 'click', 'keydown', 'pointerup'].forEach(e => window.addEventListener(e, wake, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume().catch(() => {}); });
  const put = (id, pitch, gain) => {
    const v = voices[id];
    if (!v) return;
    const t = ac.currentTime;
    v.src.playbackRate.setTargetAtTime(pitch, t, 0.015);
    v.amp.gain.setTargetAtTime(gain, t, 0.015);
  };
  return {
    make(id, b64, rate) {
      const c = open(), bin = atob(b64), n = bin.length >> 1, buf = c.createBuffer(1, n, rate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) { const u = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8); d[i] = (u >= 32768 ? u - 65536 : u) / 32000; }
      const src = c.createBufferSource(), amp = c.createGain();
      src.buffer = buf; src.loop = true; amp.gain.value = 0;
      src.connect(amp); amp.connect(c.destination); src.start();
      voices[id] = { src, amp };
    },
    voice: put,
    clear() { for (const id of Object.keys(voices)) { try { voices[id].src.stop(); voices[id].amp.disconnect(); } catch (e) {} delete voices[id]; } }
  };
})();
</script>
<script src="$GODOT_URL?v=__BUILD__"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const engine = new Engine(GODOT_CONFIG);
const load = document.getElementById('load'), fill = document.getElementById('fill'), msg = document.getElementById('msg');
const fail = e => { msg.textContent = 'Не запустилось: ' + (e && e.message || e) + '. Нужен свежий браузер.'; document.getElementById('bar').style.display = 'none'; };
if (!document.createElement('canvas').getContext('webgl2')) fail('нет WebGL 2');
else engine.startGame({
  onProgress: (cur, total) => { if (total > 0) { fill.style.width = Math.min(100, cur / total * 100) + '%'; msg.textContent = 'Загрузка ' + Math.round(cur / total * 100) + '%'; } }
}).then(() => { load.remove(); }).catch(fail);
</script>
</body>
</html>
