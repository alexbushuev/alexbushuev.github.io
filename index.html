<style>
html,body{margin:0;height:100%;background:#17161c;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f3eedf;font:600 16px/1.3 system-ui,-apple-system,sans-serif;background:#17161c;text-align:center;padding:0 24px}
#load b{font:italic 900 44px/1 system-ui,-apple-system,sans-serif;color:#ffc81f;letter-spacing:-.01em}
#bar{width:min(320px,70vw);height:10px;background:#2c2b33}
#bar i{display:block;height:100%;width:0;background:#ffc81f}
#turn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#17161c;color:#ffc81f;font:italic 900 32px/1.1 system-ui,-apple-system,sans-serif;text-align:center;padding:24px;z-index:9}
@media (orientation:portrait) and (max-width:900px){#turn{display:flex}}
#acct{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:rgba(10,10,14,.82);z-index:8;padding:max(12px,env(safe-area-inset-top)) 16px 12px;overflow:auto;font:500 16px/1.3 system-ui,-apple-system,sans-serif;color:#f3eedf}
#acct form{width:min(420px,100%);background:#24232b;padding:14px 16px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#acct .tabs{display:flex;gap:6px}

#acct .tabs button.on{background:#ffc81f;color:#16151b}
#acct input{font:500 17px system-ui,-apple-system,sans-serif;padding:10px 11px;border:2px solid #3f3d4a;background:#17161c;color:#f3eedf;border-radius:0;outline:none;-webkit-user-select:text;user-select:text}

#acct .row{display:flex;gap:8px}

#acct .note{color:#a9a7b4;font-size:13px}

<body>
<canvas id="canvas">Нужен браузер с WebGL 2.</canvas>
<div id="load"><b>ГАЗ И ЦЕПЬ</b><div id="bar"><i id="fill"></i></div><div id="msg">Заводим…</div></div>
<div id="turn">Поверни телефон боком</div>
<div id="acct"><form autocomplete="on">
<div class="tabs"><button type="button" data-m="login">Вход</button><button type="button" data-m="create">Новый аккаунт</button></div>
<input name="username" id="acctLogin" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20" placeholder="Логин">
<input name="password" id="acctPw" type="password" autocomplete="current-password" maxlength="200" placeholder="Пароль">
<div class="err" id="acctErr"></div>
<div class="row"><button type="button" class="back" id="acctBack">Назад</button><button type="submit" class="go" id="acctGo">Войти</button></div>
<div class="note" id="acctNote"></div>
</form></div>
<script>
/* wasm and pck are stored gzipped on the server, so a phone downloads a quarter of the size with no server settings */
const BUILD = "5afd2931a5";
(function () {
  const real = window.fetch.bind(window);
  window.fetch = async (url, opts) => {
    const u = String(url);
    const m = u.match(/^(.*\.(?:wasm|pck))(?:\?.*)?$/);
    if (!m) return real(url, opts);
    if (typeof DecompressionStream === 'undefined') throw new Error('old browser');
    const r = await real(m[1] + '.gz?v=' + BUILD, opts);
    if (!r.ok) return r;
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip')), {
      status: 200, headers: { 'Content-Type': u.includes('.wasm') ? 'application/wasm' : 'application/octet-stream' } });
  };
})();
</script>
<script>
/* Sounds that loop. Godot's web playback restarts a looping sound by hand at the end of every pass, which clicks;
   a short engine loop clicked over a hundred times a second. The browser's own loop has no seam and does not care about the frame rate. */
window.gazLoops = (function () {
  let ac = null;
  const voices = {};
  const open = () => { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); return ac; };
  const wake = () => { open(); if (ac.state !== 'running') ac.resume().catch(() => {}); };
  ['touchend', 'click', 'keydown', 'pointerup'].forEach(e => window.addEventListener(e, wake, { capture: true, passive: true }));
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume().catch(() => {}); });
  const put = (id, pitch, gain) => {
    const v = voices[id];
    if (!v) return;
    const t = ac.currentTime;
    v.src.playbackRate.setTargetAtTime(pitch, t, 0.015);
    v.amp.gain.setTargetAtTime(gain, t, 0.015);
  };
  return {
    make(id, b64, rate) {
      const c = open(), bin = atob(b64), n = bin.length >> 1, buf = c.createBuffer(1, n, rate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) { const u = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8); d[i] = (u >= 32768 ? u - 65536 : u) / 32000; }
      const src = c.createBufferSource(), amp = c.createGain();
      src.buffer = buf; src.loop = true; amp.gain.value = 0;
      src.connect(amp); amp.connect(c.destination); src.start();
      voices[id] = { src, amp };
    },
    voice: put,
    clear() { for (const id of Object.keys(voices)) { try { voices[id].src.stop(); voices[id].amp.disconnect(); } catch (e) {} delete voices[id]; } }
  };
})();
</script>
<script>
/* Login and new account in plain HTML fields: a phone brings up its keyboard and can remember the password.
   The game asks for it through window.gazAccount.open() and gets the server's answer back. */
window.gazAccount = (function () {
  const el = document.getElementById('acct'), form = el.querySelector('form'), lg = document.getElementById('acctLogin'),
    pw = document.getElementById('acctPw'), err = document.getElementById('acctErr'), go = document.getElementById('acctGo'),
    note = document.getElementById('acctNote'), tabs = el.querySelectorAll('.tabs button');
  let base = '', save = '{}', cb = null, mode = 'login';
  const show = m => {
    mode = m;
    tabs.forEach(b => b.classList.toggle('on', b.dataset.m === m));
    go.textContent = m === 'create' ? 'Создать' : 'Войти';
    pw.autocomplete = m === 'create' ? 'new-password' : 'current-password';
    note.textContent = m === 'create'
      ? 'Логин от 2 до 20 букв или цифр, пароль любой. Восстановить пароль нельзя, запомни его. Твой прогресс перейдёт в аккаунт.'
      : 'Прогресс аккаунта заменит тот, что сейчас в игре. Твой нынешний вернётся, если выйдешь.';
    err.textContent = '';
  };
  const done = d => { el.style.display = 'none'; pw.value = ''; go.disabled = false; if (cb) cb(JSON.stringify(d)); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.m)));
  document.getElementById('acctBack').addEventListener('click', () => done({}));
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const login = lg.value.trim(), password = pw.value;
    if (!login || !password) { err.textContent = 'Нужны логин и пароль'; return; }
    go.disabled = true; err.textContent = '';
    try {
      const body = { login, password };
      if (mode === 'create') body.save = JSON.parse(save || '{}');
      const r = await fetch(base + (mode === 'create' ? '/register' : '/login'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { err.textContent = d.error || ('Сервер ответил ' + r.status); go.disabled = false; return; }
      d.created = mode === 'create';
      done(d);
    } catch (x) { err.textContent = 'Нет связи с сервером'; go.disabled = false; }
  });
  return { open(b, m, s, c) { base = b; save = s; cb = c; show(m); el.style.display = 'flex'; setTimeout(() => lg.focus(), 60); } };
})();
</script>
<script>
/* Full screen. The browser only lets a page go full screen inside a real tap or click, and Godot handles its taps a frame
   later. So the game's button, when pressed down, arms this, and the release of that same tap does it here.
   iPhone Safari has no full screen for pages at all; there the game is put on the home screen and opens without the panels. */
window.gazScreen = (function () {
  const de = document.documentElement;
  const req = de.requestFullscreen || de.webkitRequestFullscreen;
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  const can = !!req && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const app = () => navigator.standalone === true || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches;
  const full = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  let armed = 0;
  const toggle = () => {
    try {
      if (full()) { const p = exit.call(document); if (p && p.catch) p.catch(() => {}); }
      else { const p = req.call(de, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  };
  const fire = () => { if (armed && performance.now() - armed < 1500) { armed = 0; toggle(); } };
  ['pointerup', 'touchend', 'mouseup'].forEach(e => window.addEventListener(e, fire, { capture: true, passive: true }));
  const ios = /iPhone|iPod/.test(navigator.userAgent);
  return {
    // a page in full screen also matches display-mode: fullscreen, so that is checked first
    state() { return full() ? 'full' : (app() ? 'app' : (can ? 'window' : (ios ? 'iphone' : 'none'))); },
    arm() { armed = performance.now(); },
    late() { if (armed) { armed = 0; toggle(); } }
  };
})();
</script>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1705244,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(GODOT_CONFIG);
const load = document.getElementById('load'), fill = document.getElementById('fill'), msg = document.getElementById('msg');
const fail = e => { msg.textContent = 'Не запустилось: ' + (e && e.message || e) + '. Нужен свежий браузер.'; document.getElementById('bar').style.display = 'none'; };
if (!document.createElement('canvas').getContext('webgl2')) fail('нет WebGL 2');
else engine.startGame({
  onProgress: (cur, total) => { if (total > 0) { fill.style.width = Math.min(100, cur / total * 100) + '%'; msg.textContent = 'Загрузка ' + Math.round(cur / total * 100) + '%'; } }
}).then(() => { load.remove(); }).catch(fail);
</script>
